name: build-wpp-addin

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # COM 加载项只能在 Windows runner 上用 MSBuild 编译
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild src\BetterWPP.csproj -t:restore -p:Configuration=Release -p:Platform=x64

      - name: Build Release
        run: msbuild src\BetterWPP.csproj -t:rebuild -p:Configuration=Release -p:Platform=x64 -verbosity:minimal

      - name: Stage and name package
        shell: pwsh
        run: |
          $version = [int]((Select-Xml -Path src\BetterWPP.csproj -XPath "//Version").Node.InnerText)
          $now = [datetime]::Now
          $date = $now.ToString("yyMMdd")
          $time = $now.ToString("HHmmss")
          # 命名：PPTagent+{version整数}+{YYMMDD}+{HHMMSS}
          $pkgName = "PPTagent+$version+$date+$time"
          Write-Host "Package: $pkgName"
          "PKG_NAME=$pkgName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

          New-Item -ItemType Directory -Force -Path "out\$pkgName" | Out-Null
          Copy-Item src\bin\x64\Release\BetterWPP.dll "out\$pkgName\"
          Copy-Item src\bin\x64\Release\BetterWPP.pdb "out\$pkgName\" -ErrorAction SilentlyContinue
          # 所有依赖 DLL 一并打包（NetOffice 核心 + Office/PowerPoint 包装 + VBIDE/stdole），目标机免装 PIA
          Get-ChildItem src\bin\x64\Release\*.dll | Copy-Item -Destination "out\$pkgName\"
          Copy-Item src\register.cmd "out\$pkgName\"

          # 打 zip 便于归档下载；artifact 只上传这一个 zip，避免双层压缩
          Compress-Archive -Path "out\$pkgName\*" -DestinationPath "out\$pkgName.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: out/${{ env.PKG_NAME }}.zip
          retention-days: 30
